name: Deployment CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install and check Backend
        run: |
          cd backend
          npm install
          node --check server.js
          
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
          
      - name: Package Server
        run: |
          zip -r server.zip backend -x "backend/node_modules/*" "backend/.env" "backend/restaurant.db*"
          
      - name: Package Client
        run: |
          zip -r client.zip frontend/.next frontend/public frontend/package.json
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: |
            server.zip
            client.zip

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server.zip
            client.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
