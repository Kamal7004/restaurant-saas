name: Deployment CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  RELEASE_TAG: v${{ github.run_number }}

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install and check Backend
        run: |
          cd backend
          npm ci
          node --check server.js
          
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          
      - name: Package Server
        run: |
          cd backend && zip -r ../server.zip . -x "node_modules/*" ".env" "restaurant.db*"
          
      - name: Package Client
        run: |
          cd frontend && zip -r ../client.zip .next public package.json
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: |
            server.zip
            client.zip

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: |
            server.zip
            client.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
